# AI Traffic Management System.
#
#   docker compose up -d                          backend + dashboard
#   docker compose --profile monitoring up -d     adds Prometheus + Grafana
#
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/api/docs
#
# (No `version:` key -- it has been obsolete since Compose v2.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRAFFIC_LOG_LEVEL: ${TRAFFIC_LOG_LEVEL:-INFO}
      TRAFFIC_ENABLE_GPU_ACCELERATION: 'false'
      TRAFFIC_MODEL_CACHE_DIRECTORY: /app/models
      TRAFFIC_DATABASE_URL: sqlite+aiosqlite:////app/data/traffic.db
      # The dashboard is served same-origin through nginx, so this only covers
      # direct browser access to the API.
      TRAFFIC_ALLOWED_ORIGINS: 'http://localhost:3000,http://127.0.0.1:3000'
      TRAFFIC_TRUSTED_HOSTS: '*'
      # Put TRAFFIC_API_KEY in a .env file to require auth on write endpoints.
      TRAFFIC_API_KEY: ${TRAFFIC_API_KEY:-}
    volumes:
      # Named volume for the weights so restarts do not re-download them.
      - model_cache:/app/models
      - traffic_data:/app/data
      - ./backend/output_images:/app/output_images
      - ./backend/logs:/app/logs
    networks: [traffic]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      # Long, because the first boot downloads the detection weights.
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    depends_on:
      backend:
        condition: service_started
    networks: [traffic]
    restart: unless-stopped

  # --- Optional: metrics stack ------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [traffic]
    restart: unless-stopped
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:12.3.1
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus]
    networks: [traffic]
    restart: unless-stopped
    profiles: [monitoring]

  # --- Optional: Redis, for rate limiting shared across replicas ---------------
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks: [traffic]
    restart: unless-stopped
    profiles: [redis]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  model_cache:
  traffic_data:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  traffic:
    driver: bridge
