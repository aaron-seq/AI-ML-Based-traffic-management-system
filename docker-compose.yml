# AI Traffic Management System.
#
#   docker compose up -d                                backend + dashboard
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.monitoring.yml up -d  adds Prometheus + Grafana
#
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/api/docs
#
# (No `version:` key -- it has been obsolete since Compose v2.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRAFFIC_LOG_LEVEL: ${TRAFFIC_LOG_LEVEL:-INFO}
      TRAFFIC_ENABLE_GPU_ACCELERATION: 'false'
      TRAFFIC_MODEL_CACHE_DIRECTORY: /app/models
      TRAFFIC_DATABASE_URL: sqlite+aiosqlite:////app/data/traffic.db
      # Compose reads .env only to fill in ${...}, so every setting a deployment
      # may override has to be passed through here explicitly. The defaults
      # suit a laptop; production sets real values (see docs/deployment.md).
      # The dashboard is served same-origin through nginx, so the origins only
      # cover direct browser access to the API.
      TRAFFIC_ALLOWED_ORIGINS: ${TRAFFIC_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # The health check below reaches the backend as "localhost" and Prometheus
      # as "backend"; both are appended so a production allowlist does not turn
      # them into 400s. Safe because nothing derives URLs from the Host header.
      TRAFFIC_TRUSTED_HOSTS: ${TRAFFIC_TRUSTED_HOSTS:-*},localhost,backend
      # Put TRAFFIC_API_KEY in a .env file to require auth on write endpoints.
      TRAFFIC_API_KEY: ${TRAFFIC_API_KEY:-}
    volumes:
      # Named volume for the weights so restarts do not re-download them.
      - model_cache:/app/models
      - traffic_data:/app/data
      - ./backend/output_images:/app/output_images
      - ./backend/logs:/app/logs
    networks: [traffic]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      # Long, because the first boot downloads the detection weights.
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    depends_on:
      backend:
        condition: service_started
    networks: [traffic]
    restart: unless-stopped

volumes:
  model_cache:
  traffic_data:

networks:
  traffic:
    driver: bridge
