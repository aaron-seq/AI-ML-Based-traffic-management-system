# Prometheus scrape configuration for the traffic management backend.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: ai-traffic-management

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: traffic-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
