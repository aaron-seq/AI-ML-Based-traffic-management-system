# Serves the built dashboard and proxies API traffic to the backend.
#
# Keeping both behind one origin means the browser never makes a cross-origin
# request, so no CORS configuration is needed in production.

upstream traffic_backend {
    # Overridden by the container name in docker-compose.
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading a stale bundle
    # that references assets which no longer exist.
    # Every page load ends here (via try_files or index), so this block decides
    # the headers of the dashboard itself.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://traffic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Detection on CPU can take a few seconds; a video clip takes longer.
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }

    location /ws/ {
        proxy_pass http://traffic_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The socket is long-lived and idles between events.
        proxy_read_timeout 3600s;
    }

    # /metrics is deliberately absent: Prometheus scrapes the backend directly,
    # and this is the origin that faces the public.
    location ~ ^/(health|static)/? {
        proxy_pass http://traffic_backend;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;
}
