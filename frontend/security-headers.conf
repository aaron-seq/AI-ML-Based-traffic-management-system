# Security headers for every response the dashboard serves.
#
# Included at server level *and* in each location that sets its own
# add_header: nginx inherits add_header from the enclosing block only when the
# current block declares none, so a location that adds Cache-Control would
# otherwise silently drop all of these.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
