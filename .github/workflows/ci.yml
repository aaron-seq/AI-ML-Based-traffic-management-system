name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The CPU wheel is ~200 MB against ~3 GB for the CUDA build; CI has no GPU.
  PIP_TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$PIP_TORCH_INDEX"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        working-directory: backend
        # Informational: the codebase is not yet fully annotated.
        run: mypy app --ignore-missing-imports || true

      - name: Test
        working-directory: backend
        env:
          ENVIRONMENT: testing
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          pip install torch torchvision --index-url "$PIP_TORCH_INDEX"
          pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          ENVIRONMENT: development
          TRAFFIC_ENABLE_FILE_LOGGING: 'false'
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # The controller answers well before the model finishes downloading,
          # and the e2e specs stub detection anyway.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright specs
        working-directory: frontend
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Static analysis and dependency audit
        working-directory: backend
        run: |
          pip install bandit pip-audit
          bandit -r app -ll
          # Advisory: a transitive CVE with no available fix should not block a PR.
          pip-audit -r requirements.txt || true

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: traffic-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: traffic-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the backend image
        run: |
          docker run -d --name traffic-ci -p 8000:8000 \
            -e ENVIRONMENT=development traffic-backend:ci

          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 3
          done

          # The controller must be ready even while the model is still loading.
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q traffic_network
          curl -sf http://localhost:8000/api/v1/intersections >/dev/null

          docker logs traffic-ci
          docker rm -f traffic-ci
