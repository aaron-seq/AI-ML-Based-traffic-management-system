name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The CPU wheel is ~200 MB against ~3 GB for the CUDA build; CI has no GPU.
  PIP_TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$PIP_TORCH_INDEX"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        working-directory: backend
        # Informational: the codebase is not yet fully annotated.
        run: mypy app --ignore-missing-imports || true

      - name: Test
        working-directory: backend
        env:
          ENVIRONMENT: testing
        # The floor sits just under the measured 89%: coverage may only go up.
        run: pytest --cov=app --cov-report=term --cov-fail-under=88

      - name: Coverage summary
        if: matrix.python-version == '3.12'
        working-directory: backend
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-build
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          pip install torch torchvision --index-url "$PIP_TORCH_INDEX"
          pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          ENVIRONMENT: development
          TRAFFIC_ENABLE_FILE_LOGGING: 'false'
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # The controller answers well before the model finishes downloading,
          # and the e2e specs stub detection anyway.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright specs
        working-directory: frontend
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url "$PIP_TORCH_INDEX"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Static analysis
        working-directory: backend
        run: bandit -r app -ll

      # Audits exactly what was installed, transitive and dev packages included.
      # Local version labels are stripped first: PyPI's advisory feed only knows
      # public versions, so "torch==2.14.1+cpu" would otherwise be skipped.
      # A finding with no released fix may be waived with --ignore-vuln <ID>,
      # with a comment here explaining why it does not apply.
      - name: Dependency audit
        run: |
          pip freeze --all --exclude-editable \
            | sed -E 's/\+[A-Za-z0-9.]+$//' > "$RUNNER_TEMP/installed.txt"
          pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/installed.txt"

      # Pinned by commit, never by tag: trivy-action's tags were force-pushed to
      # malicious commits on 19 March 2026 (CVE-2026-33634, GHSA-69fq-xp46-6x23).
      # 57a97c7 is the advisory's known-good v0.35.0 and predates the attack;
      # the binary version is pinned too because v0.69.4 was the poisoned one.
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          tags: traffic-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          load: true
          tags: traffic-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the backend image
        run: |
          docker run -d --name traffic-ci -p 8000:8000 \
            -e ENVIRONMENT=development traffic-backend:ci

          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 3
          done

          # The controller must be ready even while the model is still loading.
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q traffic_network
          curl -sf http://localhost:8000/api/v1/intersections >/dev/null

          docker logs traffic-ci
          docker rm -f traffic-ci
