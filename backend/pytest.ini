[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
# load_test.py is a Locust profile run by the locust CLI; it does not match
# this glob, so pytest leaves it alone.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --strict-markers --strict-config

markers =
    slow: takes more than a second to run
    requires_model: needs real YOLO weights on disk

# Our own deprecation warnings are bugs; third-party ones are not our call.
filterwarnings =
    error::DeprecationWarning:app.*
